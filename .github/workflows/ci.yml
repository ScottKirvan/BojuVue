name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # package.exports.test.ts's artifact assertions (the built stylesheet
      # has real component styles, dist/vite.cjs is genuinely require()-able)
      # skip themselves when dist/ is absent, which is every run of the first
      # `npm test` above — dist/ isn't committed. Re-running the suite after
      # the build is what actually exercises them, and a broken published
      # artifact is exactly the class of bug they exist to catch (see #68).
      - run: npm test
