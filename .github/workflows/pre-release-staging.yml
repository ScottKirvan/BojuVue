name: Manual — Pre-Release Staging

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Version tag override — leave blank to infer from open release-please PR
        required: false
        type: string
        default: ""

permissions:
  contents: write
  models: read
  pull-requests: read

jobs:
  stage:
    uses: ScottKirvan/.github/.github/workflows/reusable-pre-release-staging.yml@main
    with:
      tag_name: ${{ inputs.tag_name }}
      project_name: ${{ github.event.repository.name }}
      project_context: "BojuVue is a Vue 3 component library published to npm as bojuvue, providing shared UI components — including VitePress-aware builds — for use in any Vue 3 or VitePress project."
      header: |
        ## BojuVue

        > A Vue3/VitePress component library, available on npm as bojuvue

        ---
      footer: |
        ---
        📖 [User Guide](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/) · 💬 [Discord](https://discord.gg/TN6XJSNK5Y) · 🐛 [Report a Bug](https://github.com/${{ github.repository }}/issues/new?template=bug_report.md) · ✨ [Request Feature](https://github.com/${{ github.repository }}/issues/new?template=feature_request.md)
      changelog_path: "notes/CHANGELOG.md"
    secrets: inherit
