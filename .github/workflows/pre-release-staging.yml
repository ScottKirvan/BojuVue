name: Manual — Pre-Release Staging

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Version tag override — leave blank to infer from open release-please PR
        required: false
        type: string
        default: ""

permissions:
  contents: write
  models: read
  pull-requests: read

jobs:
  stage:
    uses: ScottKirvan/.github/.github/workflows/reusable-pre-release-staging.yml@main
    with:
      tag_name: ${{ inputs.tag_name }}
      project_name: ${{ github.event.repository.name }}
      project_context: "BojuVue is a shared Vue 3 component library published to npm as @scottkirvan/bojuvue. It lets ScottKirvan's VitePress documentation sites share landing-page and UI components — update the library once, pull the change everywhere with npm update."
      header: |
        ## BojuVue

        > Shared Vue 3 components for ScottKirvan's VitePress sites — update once, ship everywhere.

        ---
      footer: |
        ---
        📖 [User Guide](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/) · 💬 [Discord](https://discord.gg/TN6XJSNK5Y) · 🐛 [Report a Bug](https://github.com/${{ github.repository }}/issues/new?template=bug_report.md) · ✨ [Request Feature](https://github.com/${{ github.repository }}/issues/new?template=feature_request.md)
    secrets: inherit
